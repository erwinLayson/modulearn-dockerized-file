
services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "${CLIENT_PORT}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - ./server/.env
      - ./server/.env.development
    ports:
      - "${SERVER_PORT}:8000"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: pnpm dev
    environment:
      - NODE_ENV=development
      - PORT=8000
