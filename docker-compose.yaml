services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "${CLIENT_PORT}:5173"
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - ./server/.env
      - ./server/.env.development
    ports:
      - "${SERVER_PORT}:8000"